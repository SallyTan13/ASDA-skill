# Failure Signature Analysis Configuration
# Example: python skill_learning/analyze_failure_signatures.py --config configs/analysis/haiku35_arithmetic_failures.yaml

analysis:
  name: "haiku35_arithmetic_failures_analysis"
  description: "Failure signature analysis for Haiku 3.5 arithmetic baseline"

# Model used to generate failure signatures (analyzes failures)
model:
  name: "claude-sonnet-4-5-20250929"  # qwen-flash, qwen-plus, qwen-max, claude-sonnet-4-5-20250929, etc.
  temperature: 0.0
  max_tokens: 1024

# Input configuration
input:
  results_dir: "results/haiku35_training_baseline"  # Directory with evaluation results
  splits: ["train"]  # Which splits to analyze
  famma_dataset: "famma_data/release_basic_txt-00000-of-00001.parquet"  # FAMMA metadata (subfields, options)
  pot_mode: true  # Arithmetic questions use PoT (includes error type 10: code execution error)

# Output configuration
output:
  dir: "case_analysis/haiku35_arithmetic_failures"  # Output directory

# Clustering configuration
clustering:
  method: "statistical"  # Options: "signature", "error_type", "modality", "statistical", "embedding"
  # Methods explained:
  # - signature: Full signature (modality + error_type + ops)
  # - error_type: Error type only
  # - modality: Modality only (text-only, visual-text, etc.)
  # - statistical: Subfield + error type (domain-specific clustering)
  # - embedding: Semantic similarity clustering (requires sentence-transformers)

# Checkpoint configuration
checkpoint:
  enabled: true
  interval: 10  # Save checkpoint every N signatures
